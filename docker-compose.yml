services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: inventory-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      MONGO_URI: mongodb+srv://web1deco:w1ircpl2025@cluster0.qz6z3y7.mongodb.net/
      JWT_SECRET: your_super_secret_key
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: inventory-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0